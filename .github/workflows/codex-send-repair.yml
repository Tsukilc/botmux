name: Codex send repair verification

on:
  push:
    branches:
      - fix/codex-app-send-turn-context

permissions:
  contents: read

concurrency:
  group: codex-send-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - run: node scripts/ci-net-retry.mjs bun install --frozen-lockfile
      - run: npm version "0.0.0-send-context.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: bun run build
      - name: Verify reply routing and native input attribution
        run: >-
          bun run test --
          test/dashboard-row-reply-context.test.ts
          test/resolve-session-by-id.test.ts
          test/worker-codex-app-native-input-attribution.test.ts
          test/worker-codex-app-input-proof.test.ts
          test/worker-codex-app-final-origin.test.ts
          test/worker-codex-app-protocol-merge-adversarial.test.ts
          test/codex-app-turn-dispatch.test.ts
          test/codex-app-runner.integration.test.ts
      - name: Package Darwin arm64 candidate
        run: |
          mkdir -p dist-bin
          bun scripts/build-bun-binary.mjs --target bun-darwin-arm64 --out dist-bin/botmux-darwin-arm64
          codesign --verify --verbose=2 dist-bin/botmux-darwin-arm64
          node scripts/smoke-bun-binary.mjs dist-bin/botmux-darwin-arm64
          shasum -a 256 dist-bin/botmux-darwin-arm64 > dist-bin/SHA256SUMS
          git rev-parse HEAD > dist-bin/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: botmux-send-context-darwin-arm64
          path: dist-bin/
          if-no-files-found: error
          retention-days: 7
